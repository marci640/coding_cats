version: 2

models:
  - name: int_raw_data
    description: >
      Intermediate customer data.
      Renames signup_date to registered_at.
      Adds a literal status column ('ACTIVE' for all rows).
      Source: stg_users.
    columns:
      - name: id
        description: "Unique customer identifier (Primary Key)"
        data_type: INTEGER
        tests:
          - unique
          - not_null
      - name: name
        description: "Customer full name"
        data_type: VARCHAR
        tests:
          - not_null
      - name: email
        description: "Customer email address (unique per customer)"
        data_type: VARCHAR
        tests:
          - unique
          - not_null
      - name: registered_at
        description: "Date the customer signed up (renamed from signup_date)"
        data_type: DATE
        tests:
          - not_null
      - name: plan_type
        description: "Subscription tier: basic, premium, or enterprise"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['basic', 'premium', 'enterprise']
      - name: amount
        description: "Subscription amount in USD"
        data_type: "DECIMAL(10,2)"
        tests:
          - not_null
      - name: status
        description: "Customer status (literal 'ACTIVE' for all rows)"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['ACTIVE']
      - name: processed_at
        description: "Timestamp when dbt processed this row (inherited from stg_users)"
        data_type: TIMESTAMP
        tests:
          - not_null

  - name: int_plans
    description: >
      Intermediate plan-enriched customer data.
      Joins stg_users to stg_plans on plan_type.
      Adds discount_amount as stg_users.amount * 0.20.
      Adds customer_tier: 'high_value' when amount >= 100, else 'standard'.
      Adds price_group: 'less than 30' when amount < 30, 'greater than 200' when amount > 200, else 'standard'.
      Adds plan_value_band and plan_rank for downstream health scoring.
      Filter: Excludes rows where discount_amount is 0 or NULL.
      Source: stg_users JOIN stg_plans ON plan_type.
    columns:
      - name: id
        description: "Unique customer identifier (Primary Key, from stg_users)"
        data_type: INTEGER
        tests:
          - unique
          - not_null
      - name: name
        description: "Customer full name"
        data_type: VARCHAR
        tests:
          - not_null
      - name: email
        description: "Customer email address"
        data_type: VARCHAR
        tests:
          - not_null
      - name: plan_type
        description: "Subscription tier: basic, premium, or enterprise"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['basic', 'premium', 'enterprise']
      - name: amount
        description: "Customer subscription amount in USD (from stg_users)"
        data_type: "DECIMAL(10,2)"
        tests:
          - not_null
      - name: benefit
        description: "Plan benefit description (from stg_plans)"
        data_type: VARCHAR
        tests:
          - not_null
      - name: discount_amount
        description: "20% discount on customer amount (stg_users.amount * 0.20)"
        data_type: "DECIMAL(10,2)"
        tests:
          - not_null
      - name: customer_tier
        description: "Customer value tier: 'high_value' if amount >= 100, else 'standard'"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['high_value', 'standard']
      - name: price_group
        description: >
          Price classification based on plan amount.
          'less than 30' when amount < 30.
          'greater than 200' when amount > 200.
          'standard' for all other amounts (>= 30 AND <= 200).
          See ACTIVE_ASSUMPTIONS.md A1 and A2 for TPM-approved logic.
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['less than 30', 'standard', 'greater than 200']
      - name: plan_value_band
        description: >
          Plan value segmentation for downstream scoring.
          Assumed buckets are `entry`, `growth`, `premium`, and `strategic`.
          See ACTIVE_ASSUMPTIONS.md A1.
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['entry', 'growth', 'premium', 'strategic']
      - name: plan_rank
        description: >
          Numeric plan ordering used for downstream joins and score weighting.
          Assumed mapping is basic=1, premium=2, enterprise=3.
          See ACTIVE_ASSUMPTIONS.md A2.
        data_type: INTEGER
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3]
      - name: is_high_value
        description: "Boolean flag: TRUE when plan_type IN ('premium', 'enterprise'), FALSE otherwise"
        data_type: BOOLEAN
        tests:
          - not_null
      - name: days_since_signup
        description: "Integer: Number of days between signup_date and current date (CURRENT_DATE - signup_date)"
        data_type: INTEGER
        tests:
          - not_null
      - name: processed_at
        description: "Timestamp when dbt processed this row (inherited from stg_users)"
        data_type: TIMESTAMP
        tests:
          - not_null

  - name: int_plan_features
    description: >
      Intermediate plan feature matrix.
      Joins stg_plans to stg_benefit_features on benefit.
      Enriches plans with feature flags and total feature count.
      Source: stg_plans JOIN stg_benefit_features ON benefit.
    columns:
      - name: plan_type
        description: "Subscription tier identifier (Primary Key): basic, premium, or enterprise"
        data_type: VARCHAR
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['basic', 'premium', 'enterprise']
      - name: amount
        description: "Plan list price in USD"
        data_type: "DECIMAL(10,2)"
        tests:
          - not_null
      - name: benefit
        description: "Plan benefit description"
        data_type: VARCHAR
        tests:
          - not_null
      - name: email_support
        description: "Whether email support is included"
        data_type: BOOLEAN
        tests:
          - not_null
      - name: live_chat
        description: "Whether live chat is included"
        data_type: BOOLEAN
        tests:
          - not_null
      - name: phone_support
        description: "Whether phone support is included"
        data_type: BOOLEAN
        tests:
          - not_null
      - name: api_access
        description: "Whether API access is included"
        data_type: BOOLEAN
        tests:
          - not_null
      - name: custom_integrations
        description: "Whether custom integrations are included"
        data_type: BOOLEAN
        tests:
          - not_null
      - name: sla_guarantee
        description: "Whether SLA guarantee is included"
        data_type: BOOLEAN
        tests:
          - not_null
      - name: total_features
        description: "Count of enabled features (from stg_benefit_features)"
        data_type: INTEGER
        tests:
          - not_null
      - name: processed_at
        description: "Timestamp when dbt processed this row (inherited from stg_plans)"
        data_type: TIMESTAMP
        tests:
          - not_null

  - name: int_user_stats
    description: >
      Intermediate user statistics aggregation with momentum and volatility metrics.
      Combines user data with usage hours, phone calls, and enterprise status.
      Joins stg_users (base) with aggregated usage_hours, phone_log, and enterprise_accounts.
      Computes usage_momentum (rising/stable/declining) and usage_volatility_index for trend analysis.
      Adds engagement and support burden contract fields for downstream health scoring.
      Source: stg_users LEFT JOIN usage_hours, phone_log, enterprise_accounts.
      See ACTIVE_ASSUMPTIONS.md A2-A3 for momentum and volatility thresholds.
    columns:
      - name: id
        description: "Unique user identifier (Primary Key, from stg_users)"
        data_type: INTEGER
        tests:
          - unique
          - not_null
      - name: name
        description: "Customer full name"
        data_type: VARCHAR
        tests:
          - not_null
      - name: email
        description: "Customer email address"
        data_type: VARCHAR
        tests:
          - not_null
      - name: plan_type
        description: "Subscription tier: basic, premium, or enterprise"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['basic', 'premium', 'enterprise']
      - name: total_usage_hours
        description: "Sum of all usage hours for this user (NULL if no usage data)"
        data_type: "DECIMAL(10,2)"
        tests:
          - not_null
      - name: usage_hours_last_30d
        description: "Sum of usage hours in the most recent 30-day window"
        data_type: "DECIMAL(10,2)"
        tests:
          - not_null
      - name: usage_hours_prev_30d
        description: "Sum of usage hours in the 30 days prior to the most recent window"
        data_type: "DECIMAL(10,2)"
        tests:
          - not_null
      - name: usage_momentum
        description: >
          Period-over-period usage trend classification.
          Values: 'rising', 'stable', or 'declining' based on month-to-month usage change.
          See ACTIVE_ASSUMPTIONS.md A2 for threshold definition.
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['rising', 'stable', 'declining']
      - name: usage_volatility_index
        description: >
          Bounded numeric score capturing variation in usage patterns across recent periods.
          Higher values indicate more volatile/unpredictable usage.
          See ACTIVE_ASSUMPTIONS.md A3 for calculation method and bounds.
        data_type: "DECIMAL(5,2)"
        tests:
          - not_null
      - name: total_phone_calls
        description: "Count of all phone calls for this user (0 if no calls)"
        data_type: INTEGER
        tests:
          - not_null
      - name: engagement_score
        description: >
          Bounded engagement score on a 0-100 scale derived from usage and support activity.
          Usage contributes more heavily than phone interactions.
          See ACTIVE_ASSUMPTIONS.md A3 (Sprint 09).
        data_type: "DECIMAL(5,2)"
        tests:
          - not_null
      - name: support_burden_flag
        description: >
          TRUE when support activity is considered unusually high for a single customer.
          Assumed threshold is total_phone_calls >= 2.
          See ACTIVE_ASSUMPTIONS.md A4 (Sprint 09).
        data_type: BOOLEAN
        tests:
          - not_null
      - name: usage_recency_hint
        description: >
          Activity recency bucket derived from the latest available usage or phone interaction.
          Assumed values are `current`, `recent`, `stale`, and `none`.
          See ACTIVE_ASSUMPTIONS.md A5 (Sprint 09).
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['current', 'recent', 'stale', 'none']
      - name: is_high_value_enterprise
        description: "TRUE if enterprise customer with contract_value_usd > 60000, else FALSE"
        data_type: BOOLEAN
        tests:
          - not_null
      - name: processed_at
        description: "Timestamp when dbt processed this row"
        data_type: TIMESTAMP
        tests:
          - not_null

  - name: int_customer_health
    description: >
      Intermediate customer health and churn risk scoring model.
      Joins int_plans, int_user_stats, and referral information to produce unified scoring contract.
      Computes health_score, health_momentum_score, churn_risk_score, and intervention fields.
      Includes processed_at as CAST(CURRENT_TIMESTAMP AS TIMESTAMP).
      See ACTIVE_ASSUMPTIONS.md A1-A10 for sprint-specific logic and thresholds.
    columns:
      - name: id
        description: "Unique customer identifier (Primary Key)"
        data_type: INTEGER
        tests:
          - unique
          - not_null
      - name: name
        description: "Customer full name"
        data_type: VARCHAR
        tests:
          - not_null
      - name: email
        description: "Customer email address"
        data_type: VARCHAR
        tests:
          - not_null
      - name: plan_type
        description: "Subscription tier: basic, premium, or enterprise"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['basic', 'premium', 'enterprise']
      - name: amount
        description: "Customer subscription amount in USD"
        data_type: "DECIMAL(10,2)"
        tests:
          - not_null
      - name: plan_value_band
        description: "Plan value segmentation inherited from int_plans"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['entry', 'growth', 'premium', 'strategic']
      - name: plan_rank
        description: "Numeric plan ordering inherited from int_plans"
        data_type: INTEGER
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3]
      - name: total_usage_hours
        description: "Aggregated usage hours inherited from int_user_stats"
        data_type: "DECIMAL(10,2)"
        tests:
          - not_null
      - name: usage_momentum
        description: "Usage trend classification (rising/stable/declining) inherited from int_user_stats"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['rising', 'stable', 'declining']
      - name: usage_volatility_index
        description: "Volatility score inherited from int_user_stats"
        data_type: "DECIMAL(5,2)"
        tests:
          - not_null
      - name: total_phone_calls
        description: "Aggregated phone call count inherited from int_user_stats"
        data_type: INTEGER
        tests:
          - not_null
      - name: engagement_score
        description: "Bounded engagement score on a 0-100 scale"
        data_type: "DECIMAL(5,2)"
        tests:
          - not_null
      - name: support_burden_flag
        description: "TRUE when support activity is unusually high"
        data_type: BOOLEAN
        tests:
          - not_null
      - name: usage_recency_hint
        description: "Activity recency bucket"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['current', 'recent', 'stale', 'none']
      - name: referral_status
        description: >
          Referral lifecycle state carried from stg_referral_codes where available.
          Missing referral data is treated as neutral in downstream scoring.
          See ACTIVE_ASSUMPTIONS.md A6-A7 (Sprint 09).
        data_type: VARCHAR
      - name: referral_quality_score
        description: "Referral quality contribution used in scoring composition"
        data_type: "DECIMAL(5,2)"
        tests:
          - not_null
      - name: health_score
        description: >
          Composite customer health score on a 0-100 scale.
          Combines plan value, engagement, support burden, and referral quality.
          See ACTIVE_ASSUMPTIONS.md A8-A10 (Sprint 09).
        data_type: "DECIMAL(5,2)"
        tests:
          - not_null
      - name: health_momentum_score
        description: >
          Health score adjusted for trend momentum.
          Reflects how usage trends (rising/declining) impact baseline health.
          See ACTIVE_ASSUMPTIONS.md A4 for weighting.
        data_type: "DECIMAL(5,2)"
        tests:
          - not_null
      - name: risk_band
        description: >
          Customer risk classification derived from health_score.
          Values: 'low', 'medium', 'high'
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high']
      - name: retention_priority
        description: "Outreach priority bucket derived from risk_band"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['p1', 'p2', 'p3']
      - name: churn_risk_score
        description: >
          Unified churn risk score on a 0-100 scale.
          Combines health_score, usage_momentum, support_burden_flag, and referral_quality_score.
          Higher=more likely to churn. See ACTIVE_ASSUMPTIONS.md A5-A6.
        data_type: "DECIMAL(5,2)"
        tests:
          - not_null
      - name: intervention_tier
        description: >
          Proposed intervention urgency tier for outreach.
          Values: 'immediate', 'near_term', 'monitor' based on churn_risk_score.
          May be blocked for enterprise customers per completeness rules. See ACTIVE_ASSUMPTIONS.md A6, A10.
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['immediate', 'near_term', 'monitor']
      - name: intervention_reason
        description: >
          Text/code describing primary driver of assigned intervention_tier.
          Determines which dimension (health, momentum, burden, referral) gave strongest signal.
          See ACTIVE_ASSUMPTIONS.md A8.
        data_type: VARCHAR
        tests:
          - not_null
      - name: processed_at
        description: "Timestamp when dbt processed this row"
        data_type: TIMESTAMP
        tests:
          - not_null

  - name: user_summary
    description: >
      Final user summary model with comprehensive health and retention analytics.
      Source: int_customer_health with engagement and intervention fields surfaced.
      Surfaces churn risk, intervention tier and reason, usage momentum, and action window for operations.
    columns:
      - name: id
        description: "Unique user identifier (Primary Key)"
        data_type: INTEGER
        tests:
          - unique
          - not_null
      - name: name
        description: "Customer full name"
        data_type: VARCHAR
        tests:
          - not_null
      - name: email
        description: "Customer email address"
        data_type: VARCHAR
        tests:
          - not_null
      - name: plan_type
        description: "Subscription tier: basic, premium, or enterprise"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['basic', 'premium', 'enterprise']
      - name: plan_value_band
        description: "Plan value segmentation for downstream reporting"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['entry', 'growth', 'premium', 'strategic']
      - name: total_usage_hours
        description: "Sum of all usage hours for this user"
        data_type: "DECIMAL(10,2)"
        tests:
          - not_null
      - name: total_phone_calls
        description: "Count of all phone calls for this user"
        data_type: INTEGER
        tests:
          - not_null
      - name: support_burden_flag
        description: "TRUE when support activity is unusually high"
        data_type: BOOLEAN
        tests:
          - not_null
      - name: usage_momentum
        description: "Usage trend classification (rising/stable/declining)"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['rising', 'stable', 'declining']
      - name: is_high_value_enterprise
        description: "TRUE if enterprise customer with contract_value_usd > 60000"
        data_type: BOOLEAN
        tests:
          - not_null
      - name: health_score
        description: "Composite customer health score on a 0-100 scale"
        data_type: "DECIMAL(5,2)"
        tests:
          - not_null
      - name: churn_risk_score
        description: "Unified churn risk score on a 0-100 scale"
        data_type: "DECIMAL(5,2)"
        tests:
          - not_null
      - name: risk_band
        description: "Customer risk classification derived from health_score"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high']
      - name: retention_priority
        description: "Outreach priority bucket derived from risk_band"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['p1', 'p2', 'p3']
      - name: intervention_tier
        description: "Proposed intervention urgency tier (immediate/near_term/monitor)"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['immediate', 'near_term', 'monitor']
      - name: intervention_reason
        description: "Text/code describing primary driver of assigned intervention_tier"
        data_type: VARCHAR
        tests:
          - not_null
      - name: action_window_days
        description: >
          Recommended number of days to contact customer.
          Derived from churn_risk_score so higher-risk = sooner contact.
          See ACTIVE_ASSUMPTIONS.md A7.
        data_type: INTEGER
        tests:
          - not_null
      - name: is_enterprise
        description: "TRUE if plan_type = 'enterprise', else FALSE"
        data_type: BOOLEAN
        tests:
          - not_null
      - name: processed_at
        description: "Timestamp when dbt processed this row"
        data_type: TIMESTAMP
        tests:
          - not_null

  - name: int_retention_actions
    description: >
      Intermediate retention actions model.
      Source: int_customer_health with one row per customer containing recommended outreach actions.
      Emits action_priority, action_window_days, owner_queue, and reason_code for weekly operations workflow.
      Primary key: id (unique customer identifier).
      See ACTIVE_ASSUMPTIONS.md A7-A9 for derivation logic.
    columns:
      - name: id
        description: "Unique customer identifier (Primary Key)"
        data_type: INTEGER
        tests:
          - unique
          - not_null
      - name: name
        description: "Customer full name"
        data_type: VARCHAR
        tests:
          - not_null
      - name: email
        description: "Customer email address"
        data_type: VARCHAR
        tests:
          - not_null
      - name: plan_type
        description: "Subscription tier: basic, premium, or enterprise"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['basic', 'premium', 'enterprise']
      - name: churn_risk_score
        description: "Churn risk score on 0-100 scale from int_customer_health"
        data_type: "DECIMAL(5,2)"
        tests:
          - not_null
      - name: intervention_tier
        description: "Intervention urgency tier (immediate/near_term/monitor)"
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['immediate', 'near_term', 'monitor']
      - name: intervention_reason
        description: "Primary driver of intervention assignment"
        data_type: VARCHAR
        tests:
          - not_null
      - name: action_priority
        description: >
          Computed urgency flag for sorting in operations queues.
          Derived from intervention_tier and churn_risk_score.
          See ACTIVE_ASSUMPTIONS.md A7.
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['critical', 'high', 'medium', 'low']
      - name: action_window_days
        description: >
          Number of days within which customer should be contacted.
          Higher churn_risk = fewer days. See ACTIVE_ASSUMPTIONS.md A7.
        data_type: INTEGER
        tests:
          - not_null
      - name: owner_queue
        description: >
          Assigned team queue for handling the action (e.g. csm, support, expansion).
          Determined based on plan_type, risk_band, and engagement profile. See ACTIVE_ASSUMPTIONS.md A9.
        data_type: VARCHAR
        tests:
          - not_null
      - name: reason_code
        description: >
          Coded reason for the recommended action (e.g. declining_usage, low_engagement, high_support_load).
          Drives narrative explanations in operations workflows. See ACTIVE_ASSUMPTIONS.md A8.
        data_type: VARCHAR
        tests:
          - not_null
      - name: processed_at
        description: "Timestamp when dbt processed this row"
        data_type: TIMESTAMP
        tests:
          - not_null